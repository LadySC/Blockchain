<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTP Certificados - V19 (Versión Limpia)</title>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #999; transition: background 0.3s; }

        /* Animaciones */
        .fade-in-up { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(20px); }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        
        .bar-fill { animation: fillBar 1.5s ease-out forwards; width: 0%; }
        @keyframes fillBar { to { width: 80%; } }

        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-500 { animation-delay: 500ms; }
    </style>
</head>
<body class="bg-slate-50 text-gray-800">

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- ICONOS ---
        const Icons = {
            Mail: ({className}) => <svg className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>,
            Lock: ({className}) => <svg className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>,
            Shield: ({className}) => <svg className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/></svg>,
            ShieldCheck: ({className}) => <svg className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>,
            Dashboard: ({className}) => <svg className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>,
            FileText: ({className}) => <svg className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>,
            User: ({className}) => <svg className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            Logout: ({className}) => <svg className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>,
            Plus: ({className}) => <svg className={className} width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>,
            Home: ({className}) => <svg className={className} width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
            Box: ({className}) => <svg className={className} width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" x2="12" y1="22.08" y2="12"/></svg>,
            Download: ({className}) => <svg className={className} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>,
            Search: ({className}) => <svg className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
            Qr: ({className}) => <svg className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="14" y="3" rx="1"/><rect width="5" height="5" x="14" y="14" rx="1"/><rect width="5" height="5" x="3" y="14" rx="1"/><path d="M10 17h4"/><path d="M17 17h4"/><path d="M10 7h4"/></svg>,
            Bell: ({className}) => <svg className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>,
            UserCircle: ({className}) => <svg className={className} width="26" height="26" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>,
            Globe: ({className}) => <svg className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>,
            Cpu: ({className}) => <svg className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></svg>,
            CheckCircle: ({className}) => <svg className={className} width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            Chart: ({className}) => <svg className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>,
            Users: ({className}) => <svg className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            Award: ({className}) => <svg className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>
        };

        // --- HEADER ---
        const PublicHeader = ({ activePage, onNavigate }) => (
            <header className="bg-white/90 backdrop-blur-md border-b border-gray-200 h-16 w-full flex items-center justify-between px-6 fixed top-0 z-50 shadow-sm transition-all duration-300">
                <div className="flex items-center gap-2 cursor-pointer group" onClick={() => onNavigate('login')}>
                    <div className="w-8 h-8 bg-gradient-to-br from-red-600 to-red-700 rounded-full flex items-center justify-center text-white font-bold text-lg transition-transform group-hover:scale-110 duration-300 shadow-md">U</div>
                    <span className="font-bold text-gray-800 text-lg tracking-tight">UTP Certificados</span>
                </div>
                <nav className="flex gap-2 text-sm font-medium text-gray-500 h-full items-center">
                    <button onClick={() => onNavigate('public_verify')} className={`h-full relative px-4 transition-all duration-300 hover:text-red-600 flex items-center rounded-md hover:bg-red-50 ${activePage === 'public_verify' ? 'text-red-600 font-bold' : ''}`}>Verificar{activePage === 'public_verify' && <span className="absolute bottom-0 left-0 w-full h-0.5 bg-red-600 rounded-t-full fade-in-up"></span>}</button>
                    <button onClick={() => onNavigate('emission_info')} className={`h-full relative px-4 transition-all duration-300 hover:text-red-600 flex items-center rounded-md hover:bg-red-50 ${activePage === 'emission_info' ? 'text-red-600 font-bold' : ''}`}>Emisión{activePage === 'emission_info' && <span className="absolute bottom-0 left-0 w-full h-0.5 bg-red-600 rounded-t-full fade-in-up"></span>}</button>
                </nav>
                <div className="flex gap-4 items-center text-gray-400">
                     <button onClick={() => onNavigate('login')} className="flex items-center gap-2 text-gray-600 hover:text-red-600 transition-all font-medium text-sm bg-gray-100 hover:bg-red-50 px-3 py-2 rounded-full" title="Ir al Login"><Icons.UserCircle className="w-5 h-5"/> <span>Acceder</span></button>
                </div>
            </header>
        );

        // 1. LOGIN
        const LoginScreen = ({ onLogin }) => {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const handleSubmit = (e) => { e.preventDefault(); setError(''); onLogin(email, password, setError); };
            return (
                <div className="min-h-screen bg-slate-100 flex flex-col items-center justify-center p-4 pt-24 fade-in-up">
                    <div className="bg-white p-8 rounded-2xl shadow-2xl max-w-md w-full border border-gray-100 relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-red-600 to-red-800"></div>
                        <h2 className="text-3xl font-bold text-center text-gray-900 mb-2">Iniciar Sesion</h2>
                        <p className="text-center text-gray-500 text-sm mb-8">Accede a tu expediente académico descentralizado.</p>
                        {error && <div className="mb-4 p-3 bg-red-50 text-red-600 text-sm rounded-lg text-center border border-red-100 font-semibold">{error}</div>}
                        <form className="space-y-5" onSubmit={handleSubmit}>
                            <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">Correo Institucional</label><div className="relative group"><div className="absolute left-3 top-3 text-gray-400 group-focus-within:text-red-600 transition-colors"><Icons.Mail/></div><input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="usuario@utp.edu.pe" className="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white transition-all" required /></div></div>
                            <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1.5">Contraseña</label><div className="relative group"><div className="absolute left-3 top-3 text-gray-400 group-focus-within:text-red-600 transition-colors"><Icons.Lock/></div><input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="••••••••" className="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white transition-all" required /></div><div className="text-right mt-2"><a href="#" className="text-xs text-red-600 font-semibold hover:text-red-800 transition-colors">¿Olvidaste tu contraseña?</a></div></div>
                            <button type="submit" className="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-red-200">Iniciar Sesión</button>
                            <div className="relative py-3"><div className="absolute inset-0 flex items-center"><div className="w-full border-t border-gray-200"></div></div><div className="relative flex justify-center text-xs uppercase"><span className="bg-white px-2 text-gray-400 font-bold">O continuar con</span></div></div>
                            <button type="button" className="w-full bg-white border-2 border-gray-100 hover:border-red-100 hover:bg-red-50 text-gray-700 font-bold py-3 rounded-xl flex items-center justify-center gap-2 transition-all"><div className="w-5 h-5 bg-red-600 rounded-full flex items-center justify-center text-white text-xs font-bold">U</div> UTP ID</button>
                        </form>
                        <div className="mt-8 flex items-center justify-center gap-2 text-gray-400 text-xs font-medium"><Icons.ShieldCheck className="w-4 h-4 text-green-500"/><span>Secured by UTP Blockchain</span></div>
                    </div>
                </div>
            );
        };

        // 2. EMISIÓN INFO (Landing)
        const EmissionInfoScreen = ({ onNavigate }) => (
            <div className="min-h-screen bg-slate-50 pt-16">
                <div className="bg-gradient-to-br from-red-700 to-red-900 text-white py-24 px-6 text-center relative overflow-hidden pb-48">
                    <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10"></div>
                    <div className="relative z-10 max-w-4xl mx-auto fade-in-up">
                        <div className="inline-block px-4 py-1 mb-4 border border-red-400 rounded-full bg-red-800/50 backdrop-blur-sm text-xs font-semibold tracking-wide uppercase">Tecnología Blockchain V3.0</div>
                        <h1 className="text-5xl md:text-6xl font-extrabold mb-6 tracking-tight leading-tight">Credenciales <span className="text-transparent bg-clip-text bg-gradient-to-r from-red-200 to-white">Inmutables</span></h1>
                        <p className="text-red-100/90 text-xl max-w-2xl mx-auto mb-10 leading-relaxed font-light">Certificación académica de próxima generación impulsada por tecnología blockchain descentralizada.</p>
                        <button onClick={() => onNavigate('login')} className="bg-white text-red-900 font-extrabold py-4 px-10 rounded-full shadow-2xl hover:shadow-white/20 hover:bg-gray-50 transition-all transform hover:-translate-y-1 flex items-center gap-2 mx-auto"><span>Acceder al Portal Administrativo</span><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg></button>
                    </div>
                </div>
                <div className="max-w-6xl mx-auto px-6 -mt-32 relative z-20">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                        <div className="bg-white p-8 rounded-3xl shadow-xl hover:shadow-2xl transition-all duration-300 fade-in-up delay-100 border-t-4 border-blue-500 group hover:-translate-y-2"><div className="w-16 h-16 bg-blue-50 rounded-2xl flex items-center justify-center text-blue-600 mb-6 group-hover:bg-blue-600 group-hover:text-white transition-colors shadow-sm"><Icons.FileText className="w-8 h-8" /></div><h3 className="text-xl font-bold text-gray-900 mb-3">Generación Digital</h3><p className="text-gray-500 leading-relaxed text-sm">Firma criptográfica de documentos académicos garantizando la autoría institucional.</p></div>
                        <div className="bg-white p-8 rounded-3xl shadow-xl hover:shadow-2xl transition-all duration-300 fade-in-up delay-200 border-t-4 border-purple-500 group hover:-translate-y-2"><div className="w-16 h-16 bg-purple-50 rounded-2xl flex items-center justify-center text-purple-600 mb-6 group-hover:bg-purple-600 group-hover:text-white transition-colors shadow-sm"><Icons.Cpu className="w-8 h-8" /></div><h3 className="text-xl font-bold text-gray-900 mb-3">Consenso Blockchain</h3><p className="text-gray-500 leading-relaxed text-sm">Anclaje de hash en la red distribuida, haciendo imposible la falsificación o alteración.</p></div>
                        <div className="bg-white p-8 rounded-3xl shadow-xl hover:shadow-2xl transition-all duration-300 fade-in-up delay-300 border-t-4 border-teal-500 group hover:-translate-y-2"><div className="w-16 h-16 bg-teal-50 rounded-2xl flex items-center justify-center text-teal-600 mb-6 group-hover:bg-teal-600 group-hover:text-white transition-colors shadow-sm"><Icons.CheckCircle className="w-8 h-8" /></div><h3 className="text-xl font-bold text-gray-900 mb-3">Verificación Universal</h3><p className="text-gray-500 leading-relaxed text-sm">Validación instantánea y global sin necesidad de intermediarios.</p></div>
                    </div>
                </div>
                <div className="mt-20 bg-slate-900 py-16 text-white"><div className="max-w-6xl mx-auto px-6"><div className="grid grid-cols-2 md:grid-cols-4 gap-8 text-center divide-x divide-slate-800"><div className="fade-in-up delay-100"><div className="text-4xl font-bold text-red-500 mb-2">50K+</div><div className="text-xs text-slate-400 uppercase tracking-widest font-semibold">Credenciales</div></div><div className="fade-in-up delay-200"><div className="text-4xl font-bold text-blue-400 mb-2">100%</div><div className="text-xs text-slate-400 uppercase tracking-widest font-semibold">Disponibilidad</div></div><div className="fade-in-up delay-300"><div className="text-4xl font-bold text-green-400 mb-2">0.5s</div><div className="text-xs text-slate-400 uppercase tracking-widest font-semibold">Tiempo Valid.</div></div><div className="fade-in-up delay-400"><div className="text-4xl font-bold text-purple-400 mb-2">256</div><div className="text-xs text-slate-400 uppercase tracking-widest font-semibold">Cifrado AES</div></div></div></div></div>
                <footer className="bg-slate-50 border-t border-slate-200 py-8 text-center text-slate-400 text-sm">© 2025 Universidad Tecnológica del Perú. Todos los derechos reservados.</footer>
            </div>
        );

        // 3. VERIFICACIÓN
        const VerifyScreen = ({ onNavigate }) => (
            <div className="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-red-50 flex flex-col pt-16 relative overflow-hidden">
                <div className="absolute top-20 left-20 w-96 h-96 bg-indigo-300/20 rounded-full blur-3xl animate-pulse"></div>
                <div className="absolute bottom-20 right-20 w-96 h-96 bg-red-300/20 rounded-full blur-3xl animate-pulse delay-500"></div>
                <main className="flex-1 flex flex-col items-center justify-center px-4 text-center z-10 py-12">
                    <div className="bg-white/80 backdrop-blur-xl p-10 rounded-[2rem] shadow-2xl border border-white/50 max-w-xl w-full fade-in-up transition-all duration-300 hover:shadow-indigo-200/50">
                        <div className="w-24 h-24 bg-gradient-to-tr from-indigo-600 to-blue-500 rounded-3xl flex items-center justify-center mx-auto mb-8 shadow-lg shadow-indigo-500/30 fade-in-up delay-100 transform transition-transform hover:rotate-3"><Icons.ShieldCheck className="w-12 h-12 text-white" /></div>
                        <h1 className="text-4xl font-extrabold text-gray-900 mb-4 tracking-tight fade-in-up delay-200">Validador Oficial</h1>
                        <p className="text-gray-500 mb-10 text-lg leading-relaxed fade-in-up delay-300">Consulte la integridad de un certificado académico en la red Blockchain.</p>
                        <div className="space-y-6 fade-in-up delay-400">
                            <div className="relative group"><div className="absolute left-5 top-4 text-gray-400 group-focus-within:text-indigo-600 transition-colors duration-300"><Icons.Search className="w-6 h-6" /></div><input type="text" placeholder="Pegar ID del Certificado (ej. 0xabcd...)" className="w-full pl-14 pr-4 py-4 border-2 border-gray-100 rounded-2xl bg-gray-50/50 focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all duration-300 outline-none text-gray-800 font-medium text-lg shadow-sm" /></div>
                            <div className="relative flex py-3 items-center"><div className="flex-grow border-t border-gray-200"></div><span className="flex-shrink-0 mx-4 text-gray-400 text-sm font-bold uppercase tracking-wider text-[10px]">O escanear código</span><div className="flex-grow border-t border-gray-200"></div></div>
                            <button className="w-full bg-gray-900 hover:bg-black text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-3 transition-all transform hover:scale-[1.02] active:scale-[0.98] shadow-xl hover:shadow-2xl text-lg"><Icons.Qr className="w-6 h-6" /> Activar Cámara</button>
                        </div>
                         <div className="pt-8 mt-6 border-t border-gray-100 flex items-center justify-center gap-2 text-gray-400 text-sm font-medium fade-in-up delay-500"><div className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div><span>Nodo Verificador Activo</span></div>
                    </div>
                </main>
            </div>
        );

        // 4. STUDENT DASHBOARD
        const StudentDashboard = ({ onLogout, onNavigate }) => {
            const certificates = [
                { name: 'CISCO y Redes', status: 'Emitido', date: '2025-08-15', action: true },
                { name: 'Desarrollo Fullstack', status: 'Emitido', date: '2025-05-10', action: true },
                { name: 'Scrum Fundamentals', status: 'Emitido', date: '2024-11-20', action: true },
                { name: 'Inglés Técnico II', status: 'Emitido', date: '2024-08-15', action: true },
                { name: 'Blockchain Av.', status: 'Pendiente', date: '2025-09-20', action: false }
            ];
            const total = certificates.length;
            const issued = certificates.filter(c => c.status === 'Emitido').length;
            const percentage = Math.round((issued / total) * 100);

            return (

                                            <div className="w-full bg-indigo-400 rounded-t-lg relative group h-[80%] bar-grow hover:bg-indigo-500 transition-all delay-300"><div className="absolute -top-8 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs py-1 px-2 rounded opacity-0 group-hover:opacity-100 transition-opacity">350</div></div>
                                            <div className="w-full bg-indigo-500 rounded-t-lg relative group h-[55%] bar-grow hover:bg-indigo-600 transition-all delay-400"><div className="absolute -top-8 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs py-1 px-2 rounded opacity-0 group-hover:opacity-100 transition-opacity">210</div></div>
                                            <div className="w-full bg-indigo-600 rounded-t-lg relative group h-[90%] bar-grow hover:bg-indigo-700 transition-all delay-500"><div className="absolute -top-8 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs py-1 px-2 rounded opacity-0 group-hover:opacity-100 transition-opacity">400</div></div>
                                        </div>
                                        <div className="w-full flex justify-between px-4 text-xs font-bold text-slate-400"><span>MAY</span><span>JUN</span><span>JUL</span><span>AGO</span><span>SET</span><span>OCT</span></div>
                                        <p className="text-slate-400 font-bold text-lg mt-4">Resumen de Emisiones</p>
                                    </div>
                                    <div className="bg-white p-8 rounded-[2.5rem] shadow-xl shadow-slate-200/50 border border-slate-100">
                                        <h3 className="font-bold text-slate-900 text-xl mb-6">Actividad Reciente</h3>
                                        <ul className="space-y-4">
                                            <li className="flex items-center gap-4 p-3 hover:bg-slate-50 rounded-2xl transition-colors"><div className="w-10 h-10 bg-green-100 text-green-600 rounded-full flex items-center justify-center"><Icons.CheckCircle className="w-5 h-5"/></div><div><p className="font-bold text-slate-800 text-sm">Certificado Verificado</p><p className="text-xs text-slate-400">Hace 5 minutos • ID #9988</p></div></li>
                                            <li className="flex items-center gap-4 p-3 hover:bg-slate-50 rounded-2xl transition-colors"><div className="w-10 h-10 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center"><Icons.Plus className="w-5 h-5"/></div><div><p className="font-bold text-slate-800 text-sm">Nueva Emisión</p><p className="text-xs text-slate-400">Hace 2 horas • Jorge M.</p></div></li>
                                            <li className="flex items-center gap-4 p-3 hover:bg-slate-50 rounded-2xl transition-colors"><div className="w-10 h-10 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center"><Icons.UserCircle className="w-5 h-5"/></div><div><p className="font-bold text-slate-800 text-sm">Nuevo Estudiante</p><p className="text-xs text-slate-400">Hace 1 día • ID 2223...</p></div></li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        )}
                        {adminView === 'emision' && (
                             <div className="bg-white rounded-[2.5rem] shadow-xl shadow-slate-200/50 border border-slate-100 p-12 max-w-3xl hover:shadow-2xl transition-all duration-500 fade-in-up delay-200 relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-red-600 to-red-800"></div>

                                        <div><label className="block text-sm font-bold text-slate-700 mb-3 uppercase tracking-wider">Expiración (Opcional)</label><input type="date" className="w-full px-6 py-4 border-2 border-slate-100 rounded-2xl bg-slate-50 focus:bg-white focus:ring-4 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all outline-none font-medium text-lg text-slate-700"/></div>

                    </main>
                </div>
            );
        };

        // === APP CONTROLLER ===
        const App = () => {
            const [view, setView] = useState('login');

            const handleLogin = (email, password, setErrorCallback) => {
                if (email === 'alumno@utp.edu.pe' && password === '123456') setView('student_dashboard');
                else if (email === 'admin@utp.edu.pe' && password === 'admin123') setView('admin');
                else setTimeout(() => setErrorCallback('Credenciales incorrectas.'), 500);
            };

            const handleNavigate = (target) => {
                if (target === 'details') setView('student_details');
                if (target === 'profile') setView('student_profile');
                if (target === 'public_verify') setView('public_verify');
                if (target === 'certificates') setView('student_certificates');
                if (target === 'emission_info') setView('emission_info');
                if (target === 'dashboard') setView('student_dashboard');
                if (target === 'login') setView('login');
            };

            return (
                <div className="min-h-screen bg-gray-100 font-sans">
                    {(view === 'login' || view === 'public_verify' || view === 'emission_info') && (
                        <PublicHeader activePage={view} onNavigate={handleNavigate} />
                    )}
                    
                    {view === 'login' && <LoginScreen onLogin={handleLogin} />}
                    {view === 'public_verify' && <VerifyScreen onNavigate={handleNavigate} />}
                    {view === 'emission_info' && <EmissionInfoScreen onNavigate={handleNavigate} />}
                    
                    {view === 'student_dashboard' && <StudentDashboard onLogout={() => setView('login')} onNavigate={handleNavigate} />}
                    {view === 'student_details' && <CertificateDetails onBack={() => handleNavigate('dashboard')} />}
                    {view === 'student_certificates' && <StudentCertificates onBack={() => handleNavigate('dashboard')} onNavigate={handleNavigate} />}
                    {view === 'student_profile' && <StudentProfile onBack={() => handleNavigate('dashboard')} />}
                    
                    {view === 'admin' && <AdminDashboard onLogout={() => setView('login')} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
